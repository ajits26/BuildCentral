<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages | LaunchCentral</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" defer></script>
    <script src="supabase.js" defer></script>
    <script src="messages.js" defer></script>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="site-name"><img src="favicon.svg" class="brand-mark" alt="">Launch<span>Central</span></a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="AboutRocketry.html">About Rocketry</a>
            <a href="Communities.html">Communities</a>
            <a href="Forum.html">Forum</a>
            <a href="Events.html">Events</a>
            <a href="Messages.html">Messages</a>
            <a href="Login.html" id="authLink">Log In / Sign Up</a>
        </div>
    </nav>
    <main class="page">
        <h1>Messages</h1>
        <p class="page-intro">Private one-on-one chats with other members.</p>
        <div class="chat">
            <div id="people"></div>
            <div id="threadPane" hidden>
                <h2 id="withName"></h2>
                <div id="dmMessages" class="messages"></div>
                <form id="dmForm" class="inline-form">
                    <input type="text" id="dmInput" placeholder="Write a message" maxlength="2000" autocomplete="off">
                    <button type="submit" class="small-btn">Send</button>
                </form>
                <p id="dmError"></p>
            </div>
        </div>
    </main>
</body>
</html>
