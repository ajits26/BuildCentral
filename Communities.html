<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Communities | LaunchCentral</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" defer></script>
    <script src="supabase.js" defer></script>
    <script src="communities.js" defer></script>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="site-name"><img src="favicon.svg" class="brand-mark" alt="">Launch<span>Central</span></a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="AboutRocketry.html">About Rocketry</a>
            <a href="Communities.html">Communities</a>
            <a href="Forum.html">Forum</a>
            <a href="Events.html">Events</a>
            <a href="Messages.html">Messages</a>
            <a href="Login.html" id="authLink">Log In / Sign Up</a>
        </div>
    </nav>
    <main class="page">
        <h1>Communities</h1>
        <p class="page-intro">Find your team or start one for your school, university, or area.</p>

        <div id="mine" hidden>
            <h2 class="section-h">My communities</h2>
            <div id="myList" class="team-container"></div>
        </div>

        <h2 class="section-h">Browse communities</h2>
        <div class="form-group"><label for="filter">Show</label>
            <select id="filter"><option value="all">All communities</option><option value="Rocketeering">Rocketeering</option><option value="Robotics">Robotics</option><option value="Engineering">Engineering</option></select></div>
        <div id="communityList" class="team-container"></div>

        <details class="content-card create-box">
            <summary>Start a community</summary>

        <form id="createForm">
            <div class="form-group"><label for="cName">Name</label><input type="text" id="cName" maxlength="80" required></div>
            <div class="form-group"><label for="cType">Type</label>
                <select id="cType"><option value="Rocketeering">Rocketeering</option><option value="Robotics">Robotics</option><option value="Engineering"> Engineering</option></select></div>
            <div class="form-group"><label for="cDesc">Description</label><textarea id="cDesc" rows="2"></textarea></div>
            <label class="check-row"><input type="checkbox" id="cApproval" checked> Admins approve new members</label>
            <button type="submit" class="login-button">Create community</button>
            <p id="createMessage" aria-live="polite"></p>
        </form>
        </details>

    </main>
</body>
</html>
