<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thread | LaunchCentral</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" defer></script>
    <script src="supabase.js" defer></script>
    <script src="thread.js" defer></script>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="site-name"><img src="favicon.svg" class="brand-mark" alt="">Launch<span>Central</span></a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="AboutRocketry.html">About Rocketry</a>
            <a href="Communities.html">Communities</a>
            <a href="Forum.html">Forum</a>
            <a href="Events.html">Events</a>
            <a href="Messages.html">Messages</a>
            <a href="Login.html" id="authLink">Log In / Sign Up</a>
        </div>
    </nav>
    <main class="page">
        <p><a href="Forum.html">&larr; Back to forum</a></p>
        <h1 id="tTitle">Loading...</h1>
        <p class="post-meta" id="tMeta"></p>
        <div class="content-card"><p class="pre" id="tBody"></p>
            <button type="button" id="tReport" class="small-btn" hidden>Report thread</button>
            <button type="button" id="tDelete" class="small-btn" hidden>Delete thread</button></div>

        <div id="replyList"></div>

        <form id="replyForm" class="content-card">
            <div class="form-group"><label for="rBody">Reply</label><textarea id="rBody" rows="3" maxlength="5000" required></textarea></div>
            <button type="submit" class="login-button">Post reply</button>
            <p id="replyMsg" aria-live="polite"></p>
        </form>
    </main>
</body>
</html>
