<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team | LaunchCentral</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" defer></script>
    <script src="supabase.js" defer></script>
    <script src="team.js" defer></script>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="site-name"><img src="favicon.svg" class="brand-mark" alt="">Launch<span>Central</span></a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="AboutRocketry.html">About Rocketry</a>
            <a href="Communities.html">Communities</a>
            <a href="Forum.html">Forum</a>
            <a href="Events.html">Events</a>
            <a href="Messages.html">Messages</a>
            <a href="Login.html" id="authLink">Log In / Sign Up</a>
        </div>
    </nav>
    <header id="hero" class="team-hero">
        <div class="team-hero-inner">
            <p id="tType" class="eyebrow"></p>
            <h1 id="tName">Loading...</h1>
            <p id="tTagline" class="team-tagline"></p>
            <p><a id="joinLink" class="cta" href="Register.html">Join this team</a></p>
        </div>
    </header>

    <main class="team-wrap">
        <section>
            <h2>About the team</h2>
            <p id="tAbout" class="pre team-about"></p>
        </section>

        <section id="milestonesSec" hidden>
            <h2>Milestones</h2>
            <div id="milestones" class="milestones"></div>
        </section>

        <section>
            <h2>What we've been working on</h2>
            <p><a id="postLink" class="small-btn" href="#" hidden>Post an update</a></p>
            <div id="updates"></div>
        </section>

        <section id="gallerySec" hidden>
            <h2>Gallery</h2>
            <div id="gallery" class="gallery"></div>
        </section>

        <section id="contactSec" hidden>
            <h2>Get in touch</h2>
            <p id="tContact" class="pre"></p>
            <p><a id="tWebsite" class="cta cta-alt" href="#" target="_blank" rel="noopener noreferrer" hidden></a></p>
        </section>

        <details id="editBox" class="content-card create-box" hidden>
            <summary>Edit team page (admins)</summary>
            <form id="pageForm">
                <div class="form-group"><label for="eTagline">Tagline</label><input type="text" id="eTagline" maxlength="160"></div>
                <div class="form-group"><label for="eAbout">About the team</label><textarea id="eAbout" rows="6" maxlength="5000"></textarea></div>
                <div class="form-group"><label for="eWebsite">Website (starts with https://)</label><input type="text" id="eWebsite" maxlength="300"></div>
                <div class="form-group"><label for="eContact">Contact info</label><input type="text" id="eContact" maxlength="300"></div>
                <div class="form-group"><label for="eCover">Cover photo (JPG, PNG or WebP)</label><input type="file" id="eCover" accept="image/*"></div>
                <button type="submit" class="login-button">Save team page</button>
                <p id="pageMsg" aria-live="polite"></p>
            </form>
            <h2 class="section-h">Add a milestone</h2>
            <form id="milestoneForm">
                <div class="form-group"><label for="mWhen">When (for example "Spring 2026")</label><input type="text" id="mWhen" maxlength="40"></div>
                <div class="form-group"><label for="mTitle">Title</label><input type="text" id="mTitle" maxlength="120" required></div>
                <div class="form-group"><label for="mDetail">Details</label><textarea id="mDetail" rows="2" maxlength="600"></textarea></div>
                <button type="submit" class="login-button">Add milestone</button>
                <p id="milestoneMsg" aria-live="polite"></p>
            </form>
        </details>
    </main>
</body>
</html>
