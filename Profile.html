<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | LaunchCentral</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" defer></script>
    <script src="supabase.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="site-name"><img src="favicon.svg" class="brand-mark" alt="">Launch<span>Central</span></a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="AboutRocketry.html">About Rocketry</a>
            <a href="Communities.html">Communities</a>
            <a href="Forum.html">Forum</a>
            <a href="Events.html">Events</a>
            <a href="Messages.html">Messages</a>
            <a href="Profile.html" id="authLink">Profile</a>
            <button id="logoutButton" class="logout-button" type="button">Log Out</button>
        </div>
    </nav>

    <main class="profile-page">
        <div class="profile-card">
            <h1>Welcome, <span id="profileName"></span></h1>
            <p id="profileEmail"></p>

            <p><a href="Moderation.html">Moderation queue</a> (for community admins and moderators)</p>
            <div class="avatar-row">
                <img id="avatarImg" class="avatar big" alt="Your profile photo" hidden>
                <label class="small-btn file-btn">Change photo<input type="file" id="avatarFile" accept="image/*" hidden></label>
                <span id="avatarMsg"></span>
            </div>
            <form id="profileForm" class="profile-form">
                <div class="form-group">
                    <label for="history">Rocketry history</label>
                    <textarea id="history" rows="4" placeholder="Launches, certifications, competitions..."></textarea>
                </div>

                <div class="form-group">
                    <label for="portfolio">Portfolio</label>
                    <textarea id="portfolio" rows="3" placeholder="Links to projects, photos, or builds"></textarea>
                </div>

                <label class="check-row"><input type="checkbox" id="allowDms" checked> Allow messages from people outside my communities</label>
                <button type="submit" class="login-button">Save profile</button>
                <p id="profileMessage" aria-live="polite"></p>
            </form>
        </div>
    </main>
</body>
</html>
