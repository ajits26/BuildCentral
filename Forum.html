<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forum | LaunchCentral</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" defer></script>
    <script src="supabase.js" defer></script>
    <script src="forum.js" defer></script>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="site-name"><img src="favicon.svg" class="brand-mark" alt="">Launch<span>Central</span></a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="AboutRocketry.html">About Rocketry</a>
            <a href="Communities.html">Communities</a>
            <a href="Forum.html">Forum</a>
            <a href="Events.html">Events</a>
            <a href="Messages.html">Messages</a>
            <a href="Login.html" id="authLink">Log In / Sign Up</a>
        </div>
    </nav>
    <main class="page">
        <h1>Forum</h1>
        <p class="page-intro">Open to every member. Ask questions, share builds, and swap advice.</p>

        <form id="threadForm" class="content-card">
            <h2>Start a thread</h2>
            <div class="form-group"><label for="fCategory">Category</label><select id="fCategory"></select></div>
            <div class="form-group"><label for="fTitle">Title</label><input type="text" id="fTitle" maxlength="150" required></div>
            <div class="form-group"><label for="fBody">Details</label><textarea id="fBody" rows="4" maxlength="5000" required></textarea></div>
            <button type="submit" class="login-button">Post thread</button>
            <p id="threadMsg" aria-live="polite"></p>
        </form>

        <div class="form-group"><label for="fFilter">Show</label>
            <select id="fFilter"><option value="all">All categories</option></select></div>
        <div id="threadList"></div>
    </main>
</body>
</html>
