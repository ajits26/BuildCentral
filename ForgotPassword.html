<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | LaunchCentral</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" defer></script>
    <script src="supabase.js" defer></script>
    <script src="reset.js" defer></script>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="site-name"><img src="favicon.svg" class="brand-mark" alt="">Launch<span>Central</span></a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="AboutRocketry.html">About Rocketry</a>
            <a href="Communities.html">Communities</a>
            <a href="Forum.html">Forum</a>
            <a href="Events.html">Events</a>
            <a href="Messages.html">Messages</a>
            <a href="Login.html" id="authLink">Log In / Sign Up</a>
        </div>
    </nav>
    <main class="login-page">
        <div class="login-card">
            <h1>Reset Password</h1>
            <p class="login-subtitle">We'll email you a link to choose a new one</p>
            <form id="forgotForm">
                <div class="form-group"><label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter your email" autocomplete="email" required></div>
                <button type="submit" class="login-button">Send reset link</button>
                <p id="forgotMessage" aria-live="polite"></p>
            </form>
            <p class="signup-text"><a href="Login.html">Back to log in</a></p>
        </div>
    </main>
</body>
</html>
