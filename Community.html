<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community | LaunchCentral</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" defer></script>
    <script src="supabase.js" defer></script>
    <script src="community.js" defer></script>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="site-name"><img src="favicon.svg" class="brand-mark" alt="">Launch<span>Central</span></a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="AboutRocketry.html">About Rocketry</a>
            <a href="Communities.html">Communities</a>
            <a href="Forum.html">Forum</a>
            <a href="Events.html">Events</a>
            <a href="Messages.html">Messages</a>
            <a href="Login.html" id="authLink">Log In / Sign Up</a>
        </div>
    </nav>
    <main class="page">
        <h1 id="cTitle">Loading...</h1>
        <p class="page-intro"><span id="cMeta"></span> <span id="cDesc"></span></p>
        <p><a id="teamLink" href="#">View the public team page</a></p>

        <p class="admin-only" hidden><button type="button" id="editCommunity" class="small-btn">Edit community</button><button type="button" id="deleteCommunity" class="small-btn">Delete community</button></p>

        <div id="joinBox" class="content-card" hidden>
            <p>Join this community to see its members, events, and chat.</p>
            <button id="joinBtn" type="button" class="login-button">Join community</button>
        </div>
        <button id="leaveBtn" type="button" class="small-btn" hidden>Leave community</button>

        <div id="tabs" class="tabs">
            <button type="button" class="tab-btn active" data-tab="updates">Updates</button>
            <button type="button" class="tab-btn member-only" data-tab="chat" hidden>Chat</button>
            <button type="button" class="tab-btn member-only" data-tab="events" hidden>Events</button>
            <button type="button" class="tab-btn" data-tab="members">Members</button>
        </div>

        <section id="tab-updates" class="panel" hidden>
            <form id="updateForm" class="content-card admin-only" hidden>
                <h2>Share an update</h2>
                <div class="form-group"><label for="upTitle">Title</label><input type="text" id="upTitle" maxlength="120" required></div>
                <div class="form-group"><label for="upBody">What have you been working on?</label><textarea id="upBody" rows="4" maxlength="3000" required></textarea></div>
                <div class="form-group"><label for="upFile">Photo (optional)</label><input type="file" id="upFile" accept="image/*"></div>
                <button type="submit" class="login-button">Post update</button>
                <p id="updateMsg" aria-live="polite"></p>
            </form>
            <div id="updateList"></div>
        </section>

        <section id="tab-chat" class="panel" hidden>
            <div class="chat">
                <div>
                    <div id="channelList"></div>
                    <form id="channelForm" class="admin-only inline-form" hidden>
                        <input type="text" id="channelInput" placeholder="New channel" maxlength="40" required>
                        <button type="submit" class="small-btn">Add</button>
                    </form>
                    <p id="channelMsg"></p>
                </div>
                <div>
                    <h2 id="channelName"></h2>
                    <p class="admin-only" hidden><button type="button" id="renameChannel" class="small-btn">Rename channel</button><button type="button" id="deleteChannel" class="small-btn">Delete channel</button></p>
                    <div id="accessBox" class="admin-only" hidden></div>
                    <div id="messages" class="messages"></div>
                    <div id="replyBar" class="reply-bar" hidden></div>
                    <form id="sendForm" class="inline-form">
                        <input type="text" id="msgInput" placeholder="Write a message" maxlength="2000" autocomplete="off">
                        <label class="small-btn file-btn">Photo<input type="file" id="msgFile" accept="image/*" hidden></label>
                        <button type="submit" class="small-btn">Send</button>
                    </form>
                </div>
            </div>
        </section>

        <section id="tab-events" class="panel" hidden>
            <form id="eventForm" class="content-card admin-only" hidden>
                <h2>Add an event</h2>
                <div class="form-group"><label for="evTitle">Title</label><input type="text" id="evTitle" required></div>
                <div class="form-group"><label for="evTime">Date and time</label><input type="datetime-local" id="evTime" required></div>
                <div class="form-group"><label for="evPlace">Location</label><input type="text" id="evPlace"></div>
                <div class="form-group"><label for="evDesc">Details</label><textarea id="evDesc" rows="3"></textarea></div>
                <button type="submit" class="login-button">Add event</button>
                <p id="eventMsg" aria-live="polite"></p>
            </form>
            <div id="eventList"></div>
        </section>

        <section id="tab-members" class="panel" hidden>
            <div id="roleBox" class="content-card admin-only" hidden></div>
            <div id="requestBox" class="content-card admin-only" hidden></div>
            <div id="memberList" class="content-card"></div>
        </section>
    </main>
</body>
</html>
