<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Password | LaunchCentral</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" defer></script>
    <script src="supabase.js" defer></script>
    <script src="reset.js" defer></script>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="site-name"><img src="favicon.svg" class="brand-mark" alt="">Launch<span>Central</span></a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="AboutRocketry.html">About Rocketry</a>
            <a href="Communities.html">Communities</a>
            <a href="Forum.html">Forum</a>
            <a href="Events.html">Events</a>
            <a href="Messages.html">Messages</a>
            <a href="Login.html" id="authLink">Log In / Sign Up</a>
        </div>
    </nav>
    <main class="login-page">
        <div class="login-card">
            <h1>Choose a New Password</h1>
            <p class="login-subtitle">Use at least 8 characters</p>
            <form id="resetForm">
                <div class="form-group"><label for="password">New password</label>
                    <input type="password" id="password" autocomplete="new-password" required></div>
                <div class="form-group"><label for="confirmPassword">Confirm password</label>
                    <input type="password" id="confirmPassword" autocomplete="new-password" required></div>
                <button type="submit" class="login-button">Update password</button>
                <p id="resetMessage" aria-live="polite"></p>
            </form>
        </div>
    </main>
</body>
</html>
